version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dxd7-deluge-pia_deluge-vpn_1
      APP_PORT: 8112
      PROXY_AUTH_ADD: "false"

  deluge-vpn:
    image: binhex/arch-delugevpn:latest
    privileged: true
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "8118:8118"       # Privoxy
      - "58846:58846"     # Daemon
      - "58946:58946"     # Incoming torrent traffic
      - "58946:58946/udp"
    volumes:
      - ${APP_DATA_DIR}/data:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - VPN_ENABLED=yes
      - VPN_USER=CHANGE_ME
      - VPN_PASS=CHANGE_ME
      - VPN_PROV=pia
      - VPN_CLIENT=wireguard
      - STRICT_PORT_FORWARD=yes
      - ENABLE_PRIVOXY=yes
      - LAN_NETWORK=192.168.1.0/24
      - NAME_SERVERS=84.200.69.80,37.235.1.174,1.1.1.1
      - DELUGE_DAEMON_LOG_LEVEL=info
      - DELUGE_WEB_LOG_LEVEL=info
      - DEBUG=false
      - UMASK=000
      - PUID=1000
      - PGID=1000
    restart: unless-stopped
